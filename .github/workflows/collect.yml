# Runs the job collector every 6 hours (the same rhythm Indeed and LinkedIn use for job feeds)
# and publishes the results to the `data` branch, which the app reads from
# https://raw.githubusercontent.com/briane0717/job-hunt-data/data/v1/...
# The sources are read at the same time in separate jobs. Each publishes as soon as it finishes
# (with the newest results of the other parts), and one last job publishes the complete set. The branch is replaced on every run, so it never piles up old copies.
name: Collect jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collect.yml']

permissions:
  contents: write
  actions: read # to download the saved results of this run and the last one

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # big employers on Workday take a while; GitHub allows up to 6 hours
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with collector/parts.txt.
        part:
          - greenhouse
          - lever,ashby,workable
          - workday
          - bigworkday@0/3
          - bigworkday@1/3
          - bigworkday@2/3
          - jibe,oracle,amazon,rmk
          - phenom,radancy,eightfold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect ${{ matrix.part }}
        id: collect
        run: |
          NAME="raw-$(echo '${{ matrix.part }}' | tr ',@/' '---')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          node collector/collect.mjs --only "${{ matrix.part }}" --raw-out "$NAME.json" --minutes 300
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: ${{ steps.collect.outputs.name }}.json
          retention-days: 2
      # Publish right away with the newest results of every part, so fast parts show up in the
      # app without waiting for the slowest. The publish job below makes the final, complete copy.
      - name: Publish early
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash collector/publish.sh

  publish:
    needs: collect
    # Publish what was gathered even if one part failed, so one broken site can't hold up the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge every part and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash collector/publish.sh final
