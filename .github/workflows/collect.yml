# Runs the job collector every 6 hours (the same rhythm Indeed and LinkedIn use for job feeds)
# and publishes the results to the `data` branch, which the app reads from
# https://raw.githubusercontent.com/briane0717/job-hunt-data/data/v1/...
# The sources are read at the same time in separate jobs, then one last job merges them and
# publishes. The branch is replaced on every run, so it never piles up old copies.
name: Collect jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collect.yml']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # big employers on Workday take a while; GitHub allows up to 6 hours
    strategy:
      fail-fast: false
      matrix:
        part:
          - greenhouse
          - lever,ashby,workable
          - workday
          - bigworkday
          - jibe,oracle,amazon,rmk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect ${{ matrix.part }}
        run: node collector/collect.mjs --only "${{ matrix.part }}" --raw-out "raw-${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ strategy.job-index }}
          path: raw-${{ strategy.job-index }}.json
          retention-days: 1

  publish:
    needs: collect
    # Publish what was gathered even if one part failed, so one broken site can't hold up the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true
      - name: City coordinates (GeoNames, CC BY 4.0)
        run: |
          curl -sSfL -o cities1000.zip https://download.geonames.org/export/dump/cities1000.zip
          unzip -o -q cities1000.zip
      - name: Merge and write the app's files
        run: node --max-old-space-size=6144 collector/collect.mjs --raw-in raw --out public --places cities1000.txt
      - name: Publish to the data branch
        run: |
          cd public
          echo "Public job listings for the Job Hunt app, replaced every 6 hours. See v1/manifest.json." > README.md
          git init -q -b data
          git config user.name "job-hunt-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs collected $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
