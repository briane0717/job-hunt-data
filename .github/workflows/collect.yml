# Runs the job collector every 6 hours (the same rhythm Indeed and LinkedIn use for job feeds)
# and publishes the results to the `data` branch, which the app reads from
# https://raw.githubusercontent.com/briane0717/job-hunt-data/data/v1/...
# The branch is replaced on every run, so it never piles up old copies.
name: Collect jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collect.yml']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: City coordinates (GeoNames, CC BY 4.0)
        run: |
          curl -sSfL -o cities1000.zip https://download.geonames.org/export/dump/cities1000.zip
          unzip -o -q cities1000.zip
      - name: Collect
        run: node collector/collect.mjs --out public --places cities1000.txt
      - name: Publish to the data branch
        run: |
          cd public
          echo "Public job listings for the Job Hunt app, replaced every 6 hours. See v1/manifest.json." > README.md
          git init -q -b data
          git config user.name "job-hunt-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs collected $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
