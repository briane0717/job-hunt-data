# Runs the job collector every 6 hours (the same rhythm Indeed and LinkedIn use for job feeds)
# and publishes the results to GitHub Pages, where the app downloads them.
name: Collect jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: City coordinates (GeoNames, CC BY 4.0)
        run: |
          curl -sSfL -o cities1000.zip https://download.geonames.org/export/dump/cities1000.zip
          unzip -o -q cities1000.zip
      - name: Collect
        run: node collector/collect.mjs --out public --places cities1000.txt
      - name: Index page
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>Job Hunt data</title><p>Public job listings collected for the Job Hunt app. See <a href="v1/manifest.json">v1/manifest.json</a>.</p>' > public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
